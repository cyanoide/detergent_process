function cyl(cx,y,r,h,c){const ry=r*.32;
return `<path d="M${cx-r} ${y} L${cx-r} ${y+h} A${r} ${ry} 0 0 0 ${cx+r} ${y+h} L${cx+r} ${y} Z" fill="${c[1]}" ${ST}/><path d="M${cx} ${y} L${cx} ${y+h+ry} A${r} ${ry} 0 0 0 ${cx+r} ${y+h} L${cx+r} ${y} Z" fill="${c[2]}"/><ellipse cx="${cx}" cy="${y}" rx="${r}" ry="${ry}" fill="${c[0]}" ${ST}/>`;}
function cone(cx,y,r,r2,h,c){return `<polygon points="${P([[cx-r,y],[cx,y],[cx,y+h],[cx-r2,y+h]])}" fill="${c[1]}"/><polygon points="${P([[cx,y],[cx+r,y],[cx+r2,y+h],[cx,y+h]])}" fill="${c[2]}"/>`;}
function hop(cx,cy,s,y2,s2,c){const Q=(x,y,k)=>[[x,y-k*.5],[x+k*.866,y],[x,y+k*.5],[x-k*.866,y]];const t=Q(cx,cy,s),b=Q(cx,y2,s2);
return `<polygon points="${P([t[3],t[2],b[2],b[3]])}" fill="${c[1]}" ${ST}/><polygon points="${P([t[2],t[1],b[1],b[2]])}" fill="${c[2]}" ${ST}/><polygon points="${P(t)}" fill="#EEE9DD" ${ST}/>`;}
const Y=['#F6DD7E','#E9C547','#C9A532'],S=['#E4E7EA','#C3C8CD','#9FA5AB'],W=['#FAF8F3','#E6E2D8','#CDC8BC'],B=['#85B7EB','#378ADD','#185FA5'],C=['#F0997B','#D85A30','#993C1D'],GY=['#B4B2A9','#888780','#5F5E5A'],GR=['#C0DD97','#97C459','#639922'];
const HX=[35,100,165,230];
const paths={cr:'M65 196 L65 230',paste:'M78 250 L140 250 L140 28 L200 28 L200 36',air:'M314 188 L246 188',lift:'M200 278 L200 300 L270 300 L270 222 L320 222 L320 230',silo:'M320 305 L320 442',f1:`M${HX[0]} 424 L${HX[0]} 442`,f2:`M${HX[1]} 424 L${HX[1]} 442`,f3:`M${HX[2]} 424 L${HX[2]} 442`,f4:`M${HX[3]} 424 L${HX[3]} 442`,drop:'M150 454 L150 494',perf:'M345 512 L345 530 L256 530',out:'M200 546 L200 602'};
const FC={paste:'#D3C49A',air:'#FAC775',pow:'#F1EFE8',enz:'#97C459',perf:'#ED93B1'};
const flows=[['cr',FC.paste,1.2],['paste',FC.paste,3],['air',FC.air,1.2],['lift',FC.pow,2.2],['silo',FC.pow,2],['f1',FC.pow,.8],['f2',FC.pow,.8],['f3',FC.pow,.8],['f4',FC.enz,.8],['scr',FC.pow,2.5],['drop',FC.pow,.8],['perf',FC.perf,1.6],['out',FC.pow,1.2]];

let lang='fr',cur=-1,on=false;
try{const s=localStorage.getItem('lessive-lang');if(s&&LI[s]!==undefined)lang=s;}catch(e){}

function txt(x,y,s,cls,anchor){return `<text class="${cls}" x="${x}" y="${y}" text-anchor="${anchor||'middle'}" dominant-baseline="central">${s}</text>`;}
function build(){
 const L=T.L,l=lang;
 let s=`<svg viewBox="0 0 380 650" role="img" aria-label="${T.title[l]}">`;
 for(const k in paths){if(k==='air')continue;s+=`<path id="p_${k}" d="${paths[k]}" fill="none" stroke="#8A9097" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;}
 s+=`<path id="p_air" d="${paths.air}" fill="none" stroke="#D85A30" stroke-width="6" stroke-linecap="round"/><path d="M285 516 L285 530 M315 516 L315 530" fill="none" stroke="#8A9097" stroke-width="3"/><path id="p_scr" d="M330 448 L150 448" fill="none" stroke="none"/>`;
 s+=`<line x1="40" y1="614" x2="340" y2="614" stroke="#5F5E5A" stroke-width="3"/>`;for(let x=50;x<=330;x+=28)s+=`<circle cx="${x}" cy="620" r="3" fill="#888780"/>`;
 const g=(i,inner)=>`<g class="eq" data-i="${i}" tabindex="0" role="button" aria-label="${D[l][i][0]}">${inner}</g>`;
 s+=g(0,cube(40,25,24,24,22,W)+cube(85,32,24,24,22,W));
 s+=g(1,cyl(65,130,32,55,S)+cube(65,108,14,14,12,GY)+`<text class="inner" x="65" y="162" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">${L.crut[l]}</text>`);
 s+=g(2,cube(65,228,20,20,16,B));
 const tw=L.tower[l];
 s+=g(3,cone(200,210,44,7,65,Y)+cyl(200,45,44,165,Y)+`<circle cx="176" cy="238" r="4.5" fill="#185FA5"/><circle cx="224" cy="238" r="4.5" fill="#185FA5"/>`+
   (tw.length===2?`<text class="inner" x="200" y="118" text-anchor="middle" dominant-baseline="central" fill="#412402">${tw[0]}</text><text class="inner" x="200" y="134" text-anchor="middle" dominant-baseline="central" fill="#412402">${tw[1]}</text>`:`<text class="inner" x="200" y="126" text-anchor="middle" dominant-baseline="central" fill="#412402">${tw[0]}</text>`));
 s+=g(4,cube(330,160,20,20,18,C));
 s+=g(5,cone(320,275,22,5,30,S)+cyl(320,235,22,40,S)+`<text class="inner" x="320" y="258" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">${L.silo[l]}</text>`);
 s+=g(6,HX.map(x=>hop(x,375,24,420,7,S)).join('')+`<rect x="20" y="442" width="310" height="12" rx="6" fill="#E9C547" stroke="#C9A532" stroke-width="0.5"/>`+cube(350,434,18,18,14,GY));
 s+=g(7,`<rect x="120" y="494" width="130" height="52" fill="#E9C547"/><rect x="120" y="494" width="130" height="14" fill="#F6DD7E"/><rect x="120" y="532" width="130" height="14" fill="#C9A532"/><path d="M250 494 A9 26 0 0 1 250 546 Z" fill="#C9A532"/><ellipse cx="120" cy="520" rx="9" ry="26" fill="#BA9B2E" ${ST}/><text class="inner" x="188" y="520" text-anchor="middle" dominant-baseline="central" fill="#412402">${L.mix[l]}</text>`);
 s+=g(8,cyl(285,482,11,26,S)+cyl(315,482,11,26,S)+cyl(345,482,11,26,S));
 s+=g(9,cube(110,578,16,16,18,C)+cube(155,578,16,16,18,B)+cube(245,578,16,16,18,GR)+cube(290,578,16,16,18,Y));
 s+=txt(62,96,L.raw[l],'lbl')+txt(65,280,L.pump[l],'lbl')+txt(330,148,L.air[l],'lbl')+txt(235,288,L.lift[l],'lbl')+txt(24,472,L.screw[l],'lbl','start')+txt(315,466,L.perf[l],'lbl')+txt(190,640,L.pack[l],'lbl');
 const H=[["五钠","STPP"],["纯碱","Na₂CO₃"],["元明粉","Na₂SO₄"],["粒子",lang==='cn'?"酶":"Enzymes"]];
 H.forEach((h,i)=>{s+=txt(HX[i],316,h[0],'lblh')+txt(HX[i],331,h[1],'lbl')+txt(HX[i],346,T.roles[l][i],'lbla');});
 s+=`<g id="fx"></g></svg>`;
 document.getElementById('svgwrap').innerHTML=s;
 document.querySelectorAll('.eq').forEach(e=>{const i=+e.dataset.i;e.addEventListener('click',()=>sel(i));e.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();sel(i);}});});
 if(cur>=0)sel(cur);
 if(on)startFx();
}
function sel(i){cur=i;document.querySelectorAll('.eq').forEach(e=>e.style.opacity=(+e.dataset.i===i)?'1':'0.35');
 const d=D[lang][i],m=MODE[i];
 document.getElementById('det').innerHTML=`<h2>${d[0]}</h2>${m?`<span class="tag ${m==='c'?'c':''}">${m==='b'?T.batch[lang]:T.cont[lang]}</span>`:''}${d[1]}`;}
function startFx(){let h='';flows.forEach(f=>{for(let k=0;k<3;k++)h+=`<circle r="3" fill="${f[1]}" stroke="#5F5E5A" stroke-width="0.5"><animateMotion dur="${f[2]}s" begin="${(k*f[2]/3).toFixed(2)}s" repeatCount="indefinite"><mpath href="#p_${f[0]}"/></animateMotion></circle>`;});document.getElementById('fx').innerHTML=h;}
function playLabel(){document.getElementById('play').innerHTML=(on?'<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1" width="3" height="10" fill="currentColor"/><rect x="7" y="1" width="3" height="10" fill="currentColor"/></svg>':'<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1 L11 6 L2 11 Z" fill="currentColor"/></svg>')+(on?T.pause[lang]:T.play[lang]);}
function render(){
 document.documentElement.lang=lang==='cn'?'zh-CN':lang;
 document.getElementById('t-title').textContent=T.title[lang];
 document.getElementById('t-sub').textContent=T.sub[lang];
 document.getElementById('t-gloss').textContent=T.gloss[lang];
 document.getElementById('note').textContent=T.note[lang];
 document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang?'true':'false'));
 const cols=[FC.paste,FC.air,FC.pow,FC.enz,FC.perf];
 document.getElementById('legend').innerHTML=T.flow[lang].map((n,i)=>`<span><i class="dot" style="background:${cols[i]}"></i>${n}</span>`).join('');
 document.getElementById('thead').innerHTML=T.th[lang].map(h=>`<th>${h}</th>`).join('');
 const k=LI[lang];
 document.getElementById('tbody').innerHTML=G.map(r=>`<tr><td><span class="cn">${r[0]}</span><span class="py">${r[1]}</span></td><td class="fm">${r[2]}</td><td>${r[3][k]}</td><td>${r[4][k]}</td></tr>`).join('');
 if(cur<0)document.getElementById('det').innerHTML=`<p class="hint">${T.hint[lang]}</p>`;
 playLabel();build();
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.l;try{localStorage.setItem('lessive-lang',lang);}catch(e){}render();}));
document.getElementById('play').addEventListener('click',()=>{on=!on;if(on)startFx();else document.getElementById('fx').innerHTML='';playLabel();});
render();
</script>

</body></html>
